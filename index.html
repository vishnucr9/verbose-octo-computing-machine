<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velopipe Dashboard | Non-Disruptive Innovation Pipelines & Strategy</title>
<!-- BROWSER TAB ICON & SEARCH ENGINE SNIPPET ICON -->
<link rel="icon" type="image/png" sizes="32x32" href="logo2.png">
<link rel="icon" type="image/png" sizes="48x48" href="logo2.png">
<link rel="shortcut icon" href="logo2.png" type="image/x-icon">
<!-- APPLE MOBILE HOME SCREEN APPS -->
<link rel="apple-touch-icon" href="logo2.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://googleapis.com; font-src 'self' https://gstatic.com; script-src 'self' 'unsafe-inline'">
<meta name="description" content="Architecting industrial innovation pipelines with non-disruptive strategies. Analyze framework transitions across modern electronics, automotive, and aviation infrastructure.">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">
<style>

/* ========================================================
   SAFE VISIBILITY TRACKING (PRESERVES SCROLL SNAPPING)
   ======================================================== */

body.splash-in-view .left-nav-menu-stack,
body.splash-in-view .nav-toggle-btn {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

body.splash-in-view {
  padding-left: 0px !important;
}

/* ========================================================
   MAIN CONTENT INTERFACE TRANSITIONS (POST-SPLASH REVEAL)
   ======================================================== */
:root {
  --nav-width: 308px;
  --nav-collapsed-width: 50px;
  --nav-current-width: 308px;
}

body {
  transition: padding-left 0.25s cubic-bezier(0.2, 0, 0, 1);
}

body.nav-visible:not(.splash-in-view),
body.nav-collapsed:not(.splash-in-view),
body.nav-visible,
body.nav-collapsed {
  padding-left: 0px !important;
}

/* ========================================================
   MODULE 1: UNIFIED GLOBAL WINDOW SCROLLER WITH SNAP
   ======================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-main: #2b3137;
  --bg-card: #2b3137;
  --splash-bg: #111827;
  --text-main: #f8fafc;
  --text-muted: #cbd5e1;
  --border-muted: rgba(222, 206, 239, 0.25);
  --nav-dark: #0b0f12;
  --nav-accent: #6D4B8F;
  --toggle-bg: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
}

html {
  height: 100%;
  overflow-x: hidden;
  overflow-y: scroll;
  scroll-behavior: smooth;
  scroll-snap-type: y mandatory;
}

body {
  min-height: 100vh;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  display: block;
  overflow: visible;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  transition: padding-left 0.28s ease;
}

/* ========================================================
   SPLASH SCREEN STYLING
   ======================================================== */

.splash-overlay {
  position: relative;
  width: 100vw;
  height: 100vh;
  background-color: var(--splash-bg);
  z-index: 10;
  cursor: pointer;
  opacity: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  scroll-snap-align: start;
  scroll-snap-stop: normal;
  will-change: opacity, transform;
}

.splash-content-panel {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 16px !important;
  width: 100% !important;
  max-width: 100% !important;
  text-align: center !important;
  position: relative !important;
  top: 0 !important;
  left: 0 !important;
  height: 100vh !important;
  padding-left: 0 !important;
}

.splash-content-panel *, .splash-direct-intro-container, .splash-card-text {
  text-align: center !important;
}

.splash-event-badge {
  font-family: 'Courier New', Courier, monospace;
  font-size: 1.15rem;
  font-weight: bold;
  color: #DECEEF;
  text-align: center !important;
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: 0.05em;
  opacity: 0.9;
  margin-bottom: 8px;
}

.splash-ibm-arrow {
  position: absolute !important;
  bottom: 20px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  font-size: 3.5rem !important;
  font-weight: 900 !important;
  color: #DECEEF !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  line-height: 1 !important;
  animation: bounceArrow 2s ease-in-out infinite !important;
  text-shadow: 0 0 14px rgba(222, 206, 239, 0.65), 0 0 4px rgba(255, 255, 255, 0.85) !important;
  cursor: pointer;
  z-index: 11;
}

@keyframes bounceArrow {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.75; }
  50% { transform: translateX(-50%) translateY(12px); opacity: 1; }
}

/* ========================================================
   MASTER OVERRIDE FOR FLOATING MENU LAYOUT & FOOTER FIX
   ======================================================== */

.left-nav-menu-stack {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  height: 100vh !important;
  width: var(--nav-width) !important;
  max-width: 85vw !important;
  box-sizing: border-box !important;
  padding: 80px 16px 24px 16px !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
  align-items: stretch !important;
  background-color: #0b0f12 !important;
  z-index: 99999 !important;
  box-shadow: 12px 0px 40px rgba(0, 0, 0, 0.65) !important;
  transition: width 0.25s cubic-bezier(0.2, 0, 0, 1) !important, transform 0.25s cubic-bezier(0.2, 0, 0, 1) !important;
  transform: translateX(0);
}

/* ISSUE #2: Collapsed state shows 50px wide nav */
.left-nav-menu-stack.collapsed {
  width: var(--nav-collapsed-width) !important;
  padding: 80px 8px 24px 8px !important;
}

</style>
</head>
<body class="splash-in-view">
  <div class="splash-overlay">
    <div class="splash-content-panel">
      <div class="splash-event-badge">Velopipe</div>
      <div class="splash-ibm-arrow">⬇</div>
    </div>
  </div>
  <nav class="left-nav-menu-stack collapsed">
    <button class="nav-toggle-btn">☰</button>
    <!-- nav items -->
  </nav>
<script>
const DEBUG = true;
const log = (...args) => { if (DEBUG) console.debug('[app.js]', ...args); };

const now = () => (new Date()).getTime();
const getScrollTop = () => (window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0);
const prefersReducedMotion = () => (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Splash hide logic
document.addEventListener('DOMContentLoaded', () => {
  const body = document.body;
  const splash = document.querySelector('.splash-overlay');
  const nav = document.querySelector('.left-nav-menu-stack');
  const arrow = document.querySelector('.splash-ibm-arrow');

  const removeSplash = () => {
    body.classList.remove('splash-in-view');
    log('splash removed');
  };

  arrow && arrow.addEventListener('click', removeSplash);
  splash && splash.addEventListener('click', removeSplash);

  // restore nav width behavior
  const toggleBtn = document.querySelector('.nav-toggle-btn');
  toggleBtn && toggleBtn.addEventListener('click', () => {
    if (nav.classList.contains('collapsed')) {
      nav.classList.remove('collapsed');
      document.body.classList.add('nav-visible');
      document.documentElement.style.setProperty('--nav-current-width', '308px');
    } else {
      nav.classList.add('collapsed');
      document.body.classList.remove('nav-visible');
      document.documentElement.style.setProperty('--nav-current-width', '50px');
    }
  });
});
</script>
</body>
</html>
